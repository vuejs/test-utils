# This workflow will do a clean install of node dependencies, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    if: github.repository == 'vuejs/test-utils'
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node: [22, 24, 26]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'
      - run: pnpm install
      - run: pnpm run lint
      - run: pnpm run format-check
      - run: pnpm run test:coverage
        env:
          CI: true
      - run: pnpm run test:build
      - run: pnpm run tsd
      - run: pnpm run vue-tsc
      - run: pnpm run tsc:docs

  browser:
    if: github.repository == 'vuejs/test-utils'
    runs-on: ubuntu-latest
    container:
      # Keep this version in sync with playwright in package.json.
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --init --ipc=host

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - name: Use Node.js 26
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: 'pnpm'
      - run: pnpm install
      - name: Test in Chromium
        run: pnpm run test:browser --run
      - name: Test build in Chromium
        run: pnpm run test:browser:build --run
